name: build

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: ABOBUS123-1.21.11

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace

      - name: Mixin remap mismatches
        if: always()
        run: |
          echo "--- Loom could not remap these (target member missing) ---"
          ./gradlew build --no-daemon 2>&1 | grep "Cannot remap" || echo "none"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abobus123-jar
          path: ABOBUS123-1.21.11/build/libs/*.jar
