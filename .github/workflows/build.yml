name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abobus123-jar
          path: build/libs/*.jar
