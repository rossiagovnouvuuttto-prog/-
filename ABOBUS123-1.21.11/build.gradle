plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net/')
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

java {

}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

loom {
    // Loom >=1.6 remaps mixins itself; refmap generation is no longer needed.
    mixin {
        useLegacyMixinAp = false
    }

    runs {
        client {
            programArgs '--username', project.findProperty('mcName') ?: 'ABOBUS123_Test'
            vmArgs '-Xmx2G'
        }
    }
}

tasks.register('apiDump') {
    doLast {
        def cp = sourceSets.main.compileClasspath
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def c = loader.loadClass(project.findProperty('cls') ?: 'net.minecraft.client.render.RenderLayer')
        c.declaredMethods.findAll { java.lang.reflect.Modifier.isStatic(it.modifiers) }
                         .collect { it.name }.unique().sort().each { println it }
        println '--- fields ---'
        c.declaredFields.findAll { java.lang.reflect.Modifier.isStatic(it.modifiers) }
                        .collect { it.name }.sort().each { println it }
    }
}

tasks.register('findApi') {
    doLast {
        def needle = (project.findProperty('q') ?: 'DebugFilledBox').toLowerCase()
        sourceSets.main.compileClasspath.findAll { it.name.endsWith('.jar') }.each { f ->
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().findAll { it.name.endsWith('.class') && it.name.startsWith('net/minecraft') }.each { e ->
                        def cn = e.name[0..-7].replace('/', '.')
                        try {
                            def c = Class.forName(cn, false, new URLClassLoader([f.toURI().toURL()] as URL[]))
                            c.declaredMethods.each { m ->
                                if (m.name.toLowerCase().contains(needle)) println "$cn  ->  $m.name  returns $m.returnType.simpleName"
                            }
                            c.declaredFields.each { fl ->
                                if (fl.name.toLowerCase().contains(needle)) println "$cn  ->  FIELD $fl.name : $fl.type.simpleName"
                            }
                        } catch (Throwable ignored) {}
                    }
                }
            } catch (Throwable ignored) {}
        }
    }
}

tasks.register('findLayers') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def target = loader.loadClass('net.minecraft.client.render.RenderLayer')
        def M = java.lang.reflect.Modifier
        cp.findAll { it.name.endsWith('.jar') }.each { f ->
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (!e.name.endsWith('.class') || !e.name.startsWith('net/minecraft')) return
                        try {
                            def c = loader.loadClass(e.name[0..-7].replace('/', '.'))
                            def hits = []
                            c.declaredMethods.each { m ->
                                if (M.isStatic(m.modifiers) && target.isAssignableFrom(m.returnType)) hits << m.name
                            }
                            c.declaredFields.each { fl ->
                                if (M.isStatic(fl.modifiers) && target.isAssignableFrom(fl.type)) hits << ('FIELD ' + fl.name)
                            }
                            if (hits) println "${c.name} : ${hits.unique().sort().join(', ')}"
                        } catch (Throwable ignored) {}
                    }
                }
            } catch (Throwable ignored) {}
        }
    }
}

tasks.register('sig') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def c = loader.loadClass(project.findProperty('cls'))
        def M = java.lang.reflect.Modifier
        c.declaredMethods.findAll { M.isStatic(it.modifiers) && M.isPublic(it.modifiers) }.sort { it.name }.each { m ->
            println "${m.returnType.simpleName} ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')})"
        }
    }
}

tasks.register('sig2') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def c = loader.loadClass(project.findProperty('cls'))
        def filter = (project.findProperty('m') ?: '').toLowerCase()
        c.declaredMethods.sort { it.name }.each { mm ->
            if (filter && !mm.name.toLowerCase().contains(filter)) return
            println "${mm.returnType.simpleName} ${mm.name}(${mm.parameterTypes.collect { it.simpleName }.join(', ')})"
        }
    }
}

tasks.register('findCls') {
    doLast {
        def needle = (project.findProperty('q') ?: 'WorldRender').toLowerCase()
        sourceSets.main.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { f ->
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (e.name.endsWith('.class') && e.name.toLowerCase().contains(needle)) {
                            println e.name[0..-7].replace('/', '.') + "   [" + f.name + "]"
                        }
                    }
                }
            } catch (Throwable ignored) {}
        }
    }
}

tasks.register('findRet') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def target = loader.loadClass(project.findProperty('t'))
        cp.findAll { it.name.contains('minecraft') }.each { f ->
            new java.util.zip.ZipFile(f).withCloseable { zip ->
                zip.entries().each { e ->
                    if (!e.name.endsWith('.class') || !e.name.startsWith('net/minecraft')) return
                    try {
                        def c = loader.loadClass(e.name[0..-7].replace('/','.'))
                        c.declaredMethods.each { m ->
                            if (target.isAssignableFrom(m.returnType)) println "${c.simpleName}.${m.name}()"
                        }
                        c.declaredFields.each { fl ->
                            if (target.isAssignableFrom(fl.type)) println "${c.simpleName} FIELD ${fl.name}"
                        }
                    } catch (Throwable ig) {}
                }
            }
        }
    }
}

tasks.register('auditMixins') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def dir = file('src/main/java/com/reallyvisuals/mixin')
        dir.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            def src = f.text
            def tm = (src =~ /@Mixin\(([\w.]+)\.class\)/)
            if (!tm) return
            def simple = tm[0][1].tokenize('.').last()
            def imp = (src =~ /import ([\w.]+\.${simple});/)
            def fq = imp ? imp[0][1] : "net.minecraft.${simple}"
            def cls
            try { cls = loader.loadClass(fq) } catch (Throwable t) { println "\n!! ${f.name}: класс ${fq} НЕ НАЙДЕН"; return }
            def names = (src =~ /method = "(\w+)/).collect { it[1] }.unique()
            if (!names) return
            println "\n### ${f.name} -> ${simple}"
            names.each { n ->
                def ms = cls.declaredMethods.findAll { it.name == n }
                if (!ms) println "   !! ${n} — НЕТ ТАКОГО МЕТОДА"
                else ms.each { m ->
                    println "   ${n}(${m.parameterTypes.collect{it.simpleName}.join(', ')})"
                }
            }
        }
    }
}

// Like sig2, but also prints fields and walks superclasses. Added for the
// mixin-fixing pass: @Shadow fields and inherited methods are invisible to sig2.
tasks.register('dump') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def c = loader.loadClass(project.findProperty('cls'))
        def filter = (project.findProperty('m') ?: '').toLowerCase()
        while (c != null && c.name != 'java.lang.Object') {
            println "\n===== ${c.name}"
            c.declaredMethods.sort { it.name }.each { mm ->
                if (filter && !mm.name.toLowerCase().contains(filter)) return
                // yarn keeps MethodParameters, so real argument names come through
                // when present -- that is what tells x/y/w/h apart from x1/y1/x2/y2
                def args = mm.parameters.collect { pp ->
                    pp.isNamePresent() ? "${pp.type.simpleName} ${pp.name}" : pp.type.simpleName
                }
                println "  ${mm.returnType.simpleName} ${mm.name}(${args.join(', ')})"
            }
            c.declaredFields.sort { it.name }.each { fl ->
                if (filter && !fl.name.toLowerCase().contains(filter)) return
                println "  FIELD ${fl.type.simpleName} ${fl.name}"
            }
            c = c.superclass
        }
    }
}

// auditMixins only checks @Inject targets. @Shadow / @Accessor / @Invoker
// members compile fine even when the target member is gone (that is how
// InGameHud.scaledWidth slipped through), so they need checking too.
tasks.register('auditMembers') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def dir = file('src/main/java/com/reallyvisuals/mixin')
        def bad = 0
        dir.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            def src = f.text
            def tm = (src =~ /@Mixin\(([\w.]+)\.class\)/)
            if (!tm) return
            def simple = tm[0][1].tokenize('.').last()
            def imp = (src =~ /import ([\w.]+\.${simple});/)
            def fq = imp ? imp[0][1] : "net.minecraft.${simple}"
            def cls
            try { cls = loader.loadClass(fq) } catch (Throwable t) {
                println "\n!! ${f.name}: класс ${fq} НЕ НАЙДЕН"; return
            }
            def wanted = []
            // @Accessor("x") / @Invoker("x") name the member directly
            (src =~ /@(?:Accessor|Invoker)\("(\w+)"\)/).each { wanted << it[1] }
            // @Shadow (optionally @Final) then a field or method declaration
            (src =~ /@Shadow[^\n]*\n(?:\s*@\w+[^\n]*\n)*\s*[\w<>\[\], .]+?\s+(\w+)\s*[;(]/).each { wanted << it[1] }
            wanted = wanted.unique()
            if (!wanted) return

            def names = [] as Set
            for (def c = cls; c != null && c != Object; c = c.superclass) {
                c.declaredMethods.each { names << it.name }
                c.declaredFields.each { names << it.name }
            }
            def missing = wanted.findAll { !names.contains(it) }
            if (missing) {
                bad += missing.size()
                println "\n!! ${f.name} -> ${simple}"
                missing.each { println "   !! ${it} — НЕТ ТАКОГО ЧЛЕНА" }
            } else {
                println "\nOK ${f.name} -> ${simple}: ${wanted.join(', ')}"
            }
        }
        println "\n=== отсутствующих членов: ${bad} ==="
    }
}


// auditMixins checks that the TARGET method exists; it does not check that the
// handler's parameters match it. That mismatch is invisible to javac and only
// surfaces as InvalidInjectionException at runtime (GameRenderer.render and
// InGameOverlayRenderer.renderFireOverlay both did exactly this).
tasks.register('auditSigs') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[])
        def cfg = file('src/main/resources/reallyvisuals.mixins.json').text
        def dir = file('src/main/java/com/reallyvisuals/mixin')
        def problems = []

        // index of the ')' matching the '(' at position i
        def close = { String str, int i ->
            int d = 0
            int found = -1
            for (int j = i; j < str.length() && found < 0; j++) {
                if (str.charAt(j) == ('(' as char)) d++
                else if (str.charAt(j) == (')' as char)) { d--; if (d == 0) found = j }
            }
            return found
        }
        def simpleOf = { String t ->
            t.replaceAll('<.*?>', '').replaceAll('\\[\\]', '').replaceAll('^.*\\.', '')
        }

        // modifiers are consumed explicitly: 'private static void foo(' silently
        // fell through an earlier version of this pattern, skipping the check
        def HANDLER = ~'(?:private|public|protected)\\s+(?:(?:static|final|synchronized)\\s+)*[\\w<>\\[\\].]+\\s+([\\w\\$]+)\\s*\\('

        dir.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            def rel = dir.toPath().relativize(f.toPath()).toString().replace(File.separator, '.')
            def key = rel.substring(0, rel.length() - 5)
            if (!cfg.contains('"' + key + '"')) return    // not loaded at runtime

            def src = f.text
            def tm = (src =~ '@Mixin\\(([\\w.]+)\\.class\\)')
            if (!tm) return
            def simple = tm[0][1].tokenize('.').last()
            def imp = (src =~ 'import ([\\w.]+\\.' + simple + ');')
            def fqTarget = imp ? imp[0][1] : 'net.minecraft.' + simple
            def cls = null
            try { cls = loader.loadClass(fqTarget) } catch (Throwable t) { }
            if (cls == null) return

            def m = (src =~ '@Inject\\s*\\(')
            while (m.find()) {
                int o = m.end() - 1
                int c = close(src, o)
                if (c < 0) { problems << "${f.name}: не закрыта скобка @Inject"; continue }
                def ann = src.substring(o + 1, c)
                def nm = (ann =~ 'method\\s*=\\s*"(\\w+)')
                if (!nm) { problems << "${f.name}: не разобран method= в @Inject"; continue }
                def name = nm[0][1]

                def hm = HANDLER.matcher(src.substring(c))
                if (!hm.find()) { problems << "${f.name} -> ${name}: НЕ РАЗОБРАН ОБРАБОТЧИК"; continue }
                int ho = c + hm.end() - 1
                int hc = close(src, ho)
                if (hc < 0) { problems << "${f.name} -> ${name}: не закрыты параметры"; continue }
                def handler = hm.group(1)

                def ps = []
                src.substring(ho + 1, hc).split(',').each { p ->
                    def t = p.trim()
                    if (t.length() > 0) {
                        def parts = t.split('\\s+')
                        if (parts.length >= 2) ps << simpleOf(parts[parts.length - 2])
                    }
                }
                while (ps.size() > 0 && ps[ps.size() - 1].startsWith('CallbackInfo')) ps.remove(ps.size() - 1)

                def found = cls.declaredMethods.findAll { it.name == name }
                if (found.isEmpty()) {
                    problems << "${f.name}.${handler} -> ${name}: НЕТ ТАКОГО МЕТОДА"
                } else {
                    def ok = found.any { mm -> mm.parameterTypes.collect { pt -> pt.simpleName } == ps }
                    if (!ok) {
                        def lines = ["${f.name}.${handler} -> ${name}", "     обработчик: (${ps.join(', ')})"]
                        found.each { mm ->
                            lines << "     в jar:      (${mm.parameterTypes.collect { pt -> pt.simpleName }.join(', ')})"
                            lines << "       полностью: (${mm.parameterTypes.collect { pt -> pt.name }.join(', ')})"
                        }
                        problems << lines.join('\n')
                    }
                }
            }
        }
        problems.each { println "\n!! " + it }
        println "\n=== несовпадений сигнатур: ${problems.size()} ==="
    }
}
